<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#0b0f1a; --panel:#111a2c; --panel-2:#18233a; --border:#22304a; --border-2:#2c3d5e;
  --text:#e6edf7; --muted:#8ea0b8; --green:#4ade80; --purple:#a78bfa; --blue:#60a5fa;
  --amber:#fbbf24; --red:#f87171;
  --grad:linear-gradient(135deg,#34d399 0%,#4ade80 35%,#60a5fa 100%);
  --grad-vip:linear-gradient(135deg,#f59e0b 0%,#fbbf24 50%,#f87171 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',Arial,sans-serif;color:var(--text);min-height:100vh;line-height:1.5;
  background:radial-gradient(1100px 520px at 85% -10%, rgba(124,58,237,.14), transparent 60%),
             radial-gradient(900px 460px at -10% 0%, rgba(52,211,153,.10), transparent 55%),
             var(--bg);
  overflow-x:hidden;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:8px}
button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}

/* ============ TOPO DOS FILTROS / ANÚNCIO ============ */
.ann-hero{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.ann-back{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border-2);
  color:var(--text);font-size:13px;font-weight:600;border-radius:10px;padding:8px 14px;transition:.15s;flex-shrink:0;
}
.ann-back:hover{border-color:var(--blue);color:#fff;text-decoration:none}
@media (max-width:560px){.ann-hero{flex-direction:column;align-items:flex-start}.ann-hero h1{font-size:22px}}

/* ============ CARD PRINCIPAL ============ */
.detail-wrap{max-width:980px;margin:0 auto;padding:14px 20px 44px}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:26px 26px 30px;position:relative}
.detail.vip{border-color:rgba(251,191,36,.45);background:linear-gradient(150deg,rgba(251,191,36,.06),var(--panel) 55%)}

.d-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.d-badge-vip{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  font-size:11px;font-weight:800;letter-spacing:.3px;color:#7c2d12;
  background:var(--grad-vip);border-radius:999px;padding:4px 12px;margin-bottom:10px;
  box-shadow:0 4px 14px rgba(251,191,36,.35);
}

.d-type{display:inline-flex;align-items:center;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:800;border:1px solid;letter-spacing:.2px}
.d-type.venda{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35);color:var(--green)}
.d-type.compra{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35);color:var(--blue)}
.d-type.outro{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4);color:var(--purple)}

.d-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.d-meta svg{display:block;flex-shrink:0;opacity:.75}

.d-title{font-family:'Sora',sans-serif;font-size:30px;line-height:1.2;color:#fff;margin:6px 0 4px;word-wrap:break-word;overflow-wrap:anywhere}
.d-title .d-tier{font-size:15px;font-weight:800;color:var(--purple);vertical-align:super;margin-left:4px}
.d-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.d-cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.d-cat-chip{display:inline-flex;align-items:center;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:var(--purple);font-size:11px;font-weight:700;border-radius:999px;padding:3px 12px}

/* ============ COLUNAS: IMAGEM + PREÇO ============ */
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px;align-items:start}
@media (max-width:820px){.d-grid{grid-template-columns:1fr}}

.d-visual{display:flex;flex-direction:column;align-items:center;gap:14px}
.d-sprite{
  width:100%;min-height:150px;display:flex;align-items:center;justify-content:center;
  background:var(--panel-2);border:1px dashed var(--border-2);border-radius:18px;padding:20px;position:relative;
}
.d-sprite img{width:auto;height:88px;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
.d-tier-chip{
  position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.45);color:var(--purple);
  font-family:'Sora',sans-serif;font-size:11px;font-weight:800;letter-spacing:.3px;
  border-radius:999px;padding:4px 10px;line-height:1;
}
.d-ph{font-family:'Sora',sans-serif;font-size:52px;font-weight:800;color:#5b6b82}

.d-server{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;border:1px solid;font-size:13.5px;line-height:1}
.d-server b{font-weight:700;white-space:nowrap}
.d-server.green{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.d-server.green b{color:var(--green)}
.d-server.amber{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}
.d-server.amber b{color:var(--amber)}
.d-server.blue{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35)}
.d-server.blue b{color:var(--blue)}
.d-server.purple{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4)}
.d-server.purple b{color:var(--purple)}
.d-server.slate{background:rgba(142,160,184,.12);border-color:rgba(142,160,184,.35)}
.d-server.slate b{color:var(--muted)}

/* ============ PAINEL DE PREÇO ============ */
.d-panel{background:var(--panel-2);border:1px solid var(--border-2);border-radius:16px;padding:18px 18px 16px}
.d-price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-price{font-family:'Sora',sans-serif;font-size:34px;font-weight:800;color:#fff;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.d-price .d-coin{font-size:22px;display:inline-block;-webkit-text-fill-color:initial;margin-right:4px}
.d-offers{font-size:15px;font-weight:800;color:var(--amber)}
.d-sep{border:0;border-top:1px solid var(--border);margin:14px 0}
.d-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;display:block;margin:10px 0 6px}
.d-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(44,61,94,.4)}
.d-row:last-child{border-bottom:0}
.d-row .d-k{color:var(--muted)}
.d-row .d-v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
.d-user{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px 14px 5px 5px;font-size:13px;margin-top:6px}
.d-ava{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#04281a;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.d-check{color:var(--green);font-weight:900;font-size:12px;flex-shrink:0}

.d-contact{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);color:var(--green);font-size:13px;font-weight:700;border-radius:999px;padding:9px 14px;margin-top:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:break-all}
.d-contact::before{content:"\1F4E7";flex-shrink:0}

/* ============ DESCRIÇÃO ============ */
.d-desc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:18px;white-space:pre-wrap;font-size:14px;color:var(--text);line-height:1.6}

/* ============ INFO DO ITEM (WIKI) ============ */
.d-wiki{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:18px}
.d-wiki h3{font-family:'Sora',sans-serif;font-size:15px;color:#fff;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.d-wiki .d-note{color:var(--muted);font-size:12.5px;margin:4px 0 12px;line-height:1.5}
.d-grid-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 28px}
.d-wiki .d-row{border-bottom:1px solid rgba(44,61,94,.4)}
.d-wiki .d-row:last-child{border-bottom:0}

/* ============ REFERÊNCIA DE PREÇO ============ */
.d-ref{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:18px}
.d-ref h3{font-family:'Sora',sans-serif;font-size:15px;color:#fff;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.d-ref-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.d-ref-num{background:var(--panel-2);border:1px solid var(--border-2);border-radius:12px;padding:12px 14px;text-align:center}
.d-ref-num .d-k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.d-ref-num .d-v{font-size:17px;font-weight:800;color:var(--green);margin-top:2px}
.d-ref-note{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5}

/* ============ ESTADOS ============ */
.ann-loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.ann-loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border-2);border-top-color:var(--green);border-radius:50%;animation:mk-spin .8s linear infinite;vertical-align:-5px;margin-right:9px}
@keyframes mk-spin{to{transform:rotate(360deg)}}
.ann-err{text-align:center;background:var(--panel);border:1px dashed var(--border-2);border-radius:16px;padding:46px 20px;color:var(--muted);font-size:14px;margin-top:14px}
.ann-err .reload{display:inline-flex;align-items:center;background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);font-size:13px;font-weight:700;border-radius:9px;padding:9px 16px;margin-top:16px}
.ann-err .reload:hover{color:#fff;border-color:var(--blue)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script>
const API_BASE = "https://bapzx-bot-tibia.onrender.com";
const rootEl = document.getElementById("ann-root");

function params() {
  try {
    return new URLSearchParams(window.location.search);
  } catch (e) {
    const out = {};
    const m = (window.location.search || "").replace(/^\?/, "").split("&");
    for (let i = 0; i < m.length; i++) {
      if (!m[i]) continue;
      const kv = m[i].split("=");
      out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    }
    return { get: function (k) { return out[k]; } };
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.appendChild(document.createTextNode(s == null ? "" : String(s)));
  return d.innerHTML;
}

function initials(name) {
  const parts = String(name || "I").split(/[\s._-]+/).filter(Boolean);
  const a = parts[0] ? parts[0][0] : "I";
  const b = parts.length > 1 ? parts[parts.length - 1][0] : "";
  return (a + b).slice(0, 2).toUpperCase();
}

const SERVER_COLORS = {
  "auroria":"purple","belaria":"amber","bellum":"slate","drakaria":"blue",
  "eldrian":"purple","elysian":"green","infernum i":"blue","infernum ii":"blue",
  "infernum iii":"blue","lunarian":"purple","malveria":"amber","mystian":"purple",
  "obsidian":"slate","solarian":"green","tenebrium":"slate","vesperia":"slate",
};

function serverColor(world) {
  const key = (world || "").trim().toLowerCase();
  return SERVER_COLORS[key] || "slate";
}

function formatPrice(v) {
  if (v == null || v === "" || isNaN(Number(v))) return null;
  let n = Number(v);
  if (Math.floor(n) === n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  const s = n.toFixed(2).replace(/\.?0+$/, "");
  const parts = s.split(".");
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "." + parts[1] : "");
}

function formatDateTime(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return esc(String(iso));
    const pad = function (x) { return (x < 10 ? "0" : "") + x; };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear()
      + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  } catch (e) {
    return esc(String(iso));
  }
}

function statusChiado(status) {
  const s = String(status || "");
  if (!s) return "";
  if (s === "vendido") return "&#10004; Vendido";
  if (s === "expirado") return "&#9201; Expirado";
  return "&#128227; Ativo";
}

function kvRow(k, v, raw) {
  if (v == null || v === "") return "";
  return '<div class="d-row"><span class="d-k">' + k + '</span><span class="d-v">' + (raw === false ? esc(v) : v) + '</span></div>';
}

function monthDay(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return  d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
  } catch (e) { return ""; }
}

async function carregarDetalhe() {
  const p = params();
  const id = (p.get("id") || "").trim();
  if (!id || !/^\d+$/.test(id)) {
    rootEl.innerHTML = '<div class="ann-err">Anúncio não encontrado.<br><a href="troca.html" class="reload">← Voltar para os anúncios</a></div>';
    return;
  }

  let anuncio = null;
  try {
    const r = await fetch(API_BASE + "/api/troca/" + encodeURIComponent(id));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.ok || !data.anuncio) throw new Error("sem dados");
    anuncio = data.anuncio;
  } catch (e) {
    rootEl.innerHTML = '<div class="ann-err">Não foi possível carregar este anúncio (ele pode ter sido removido ou expirado).<br><a href="troca.html" class="reload">← Voltar para os anúncios</a></div>';
    return;
  }

  let info = null;
  let ref = null;
  if (anuncio.nome) {
    try {
      const ir = await fetch(API_BASE + "/api/item?nome=" + encodeURIComponent(anuncio.nome));
      if (ir.ok) {
        const idata = await ir.json();
        if (idata && idata.ok) {
          info = idata.info && Object.keys(idata.info).length ? idata.info : null;
          ref = idata.referencia && typeof idata.referencia === "object" ? idata.referencia : null;
        }
      }
    } catch (e) { /* info do wiki é bônus; segue sem ela */ }
  }

  renderizar(anuncio, info, ref);
}

function renderizar(a, info, ref) {
  const tipo = (a.tipo || "venda").toLowerCase();
  const tipoCls = tipo === "compra" ? "compra" : (tipo === "venda" ? "venda" : "outro");
  const tipoLbl = tipo === "compra" ? "Comprando" : (tipo === "venda" ? "Vendendo" : "Troca");
  const nome = (a.nome || "Item").trim();
  const world = a.world || "";

  const vipBadge = a.is_destaque ? '<span class="d-badge-vip">&#11088; Destaque VIP</span>' : '';

  const tier = (info && info.tier) ? esc(info.tier) : (a.tier != null && a.tier !== "" ? esc(String(a.tier).replace(/\.0$/,"")) : "");
  const dateHtml = a.criado_em
    ? '<span class="d-meta">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
      + formatDateTime(a.criado_em) + '</span>'
    : '';

  const tierChip = tier
    ? '<span class="d-tier-chip">&#128142; Tier ' + esc(tier) + '</span>'
    : '';

  const spriteHtml = a.sprite
    ? tierChip + '<img src="' + esc(a.sprite) + '" alt="' + esc(nome) + '" onerror="this.outerHTML=\'<div class=&quot;d-ph&quot;>' + esc(initials(nome)) + '</div>\'">'
    : '<div class="d-ph">' + esc(initials(nome)) + '</div>';

  const catHtml = (a.categoria ? '<span class="d-cat-chip">' + esc(a.categoria) + '</span>' : '');

  const priceBlock = (function () {
    const p = formatPrice(a.preco);
    if (p !== null) {
      return '<div class="d-price-row"><div class="d-price"><span class="d-coin">&#128176;</span>' + p + '</div></div>';
    }
    return '<div class="d-offers">Aceitando ofertas</div>';
  })();

  const refBlock = (function () {
    if (!ref) return "";
    const rows = [];
    if (ref.min != null || ref.max != null) {
      rows.push('<div class="d-ref-num"><div class="d-k">Mais barato</div><div class="d-v">&#128176; ' + formatPrice(ref.min) + '</div></div>');
      rows.push('<div class="d-ref-num"><div class="d-k">Mais caro</div><div class="d-v">&#128176; ' + formatPrice(ref.max) + '</div></div>');
    }
    if (ref.media != null) {
      rows.push('<div class="d-ref-num"><div class="d-k">Média</div><div class="d-v">&#128176; ' + formatPrice(ref.media) + '</div></div>');
    }
    rows.push('<div class="d-ref-num"><div class="d-k">Anúncios do item</div><div class="d-v">' + esc(ref.anuncios || 0) + '</div></div>');
    return '<section class="d-ref">'
      + '<h3>&#128202; Preço de referência</h3>'
      + '<div class="d-ref-nums">' + rows.join("") + '</div>'
      + (ref.atualizado_em ? '<p class="d-ref-note">Baseado nos anúncios ativos do mesmo item no MARKTRADE. Atualizado em ' + monthDay(ref.atualizado_em) + '.</p>' : '')
      + '</section>';
  })();

  const wikiBlock = (function () {
    if (!info) return "";
    const rows = []
      + kvRow("Tipo", info.tipo_item)
      + kvRow("Nível requerido", info.nivel)
      + kvRow("Vocação", info.vocacoes)
      + kvRow("Armor", info.armor)
      + kvRow("Peso", info.peso)
      + kvRow("Imbuement slots", info.imbuement)
      + kvRow("Resistências", info.resistencias)
      + kvRow("Atributos", info.atributos)
      + kvRow("Classificação", info.classificacao)
      + kvRow("Tier", info.tier)
      + kvRow("Vende para", info.vende_para)
      + kvRow("Compra de", info.compra_de)
      + kvRow("Implementado em", info.implementado);
    if (!rows) return "";
    return '<section class="d-wiki">'
      + '<h3>&#128295; Sobre o item</h3>'
      + '<p class="d-note">Informações da ficha do item no Tibia Wiki.</p>'
      + '<div class="d-grid-kv">' + rows + '</div>'
      + '</section>';
  })();

  const userHtml = '<span class="d-user"><span class="d-ava">' + esc(initials(a.jogador)) + '</span>'
    + '<span>' + esc(a.jogador || "Anônimo") + '</span>'
    + (a.verificado ? '<span class="d-check" title="Verificado">&#10004;</span>' : '') + '</span>';

  rootEl.innerHTML =
    '<div class="detail' + (a.is_destaque ? ' vip' : '') + '">'
    + vipBadge
    + '<div class="d-top-row">'
    + '<div>'
    + '<span class="d-type ' + tipoCls + '">' + tipoLbl + '</span>'
    + ' <span class="d-meta">' + statusChiado(a.status) + '</span>'
    + '<div class="d-title">' + esc(nome) + (tier ? '<span class="d-tier">Tier ' + tier + '</span>' : '') + '</div>'
    + '<p class="d-sub">' + dateHtml + '</p>'
    + (catHtml ? '<div class="d-cats">' + catHtml + '</div>' : '')
    + '</div>'
    + '</div>'

    + '<div class="d-grid">'
    + '<div class="d-visual">'
    + '<div class="d-sprite">' + spriteHtml + '</div>'
    + (world ? '<div class="d-server ' + serverColor(world) + '"><b>' + esc(world) + '</b></div>' : '')
    + '</div>'

    + '<div class="d-panel">'
    + priceBlock
    + '<hr class="d-sep">'
    + kvRow("Status", statusChiado(a.status))
    + kvRow("Publicado em", formatDateTime(a.criado_em), false)
    + (a.tipo === "compra" ? kvRow("Procurando", nome, false) : '')
    + (a.aceita_ofertas ? '<div class="d-row"><span class="d-k">Ofertas</span><span class="d-v">Aceita ofertas</span></div>' : '')
    + '<div class="d-label">Anunciante</div>'
    + userHtml
    + (a.contato ? '<div class="d-contact" title="' + esc(a.contato) + '">' + esc(a.contato) + '</div>' : '')
    + '</div>'
    + '</div>'

    + (a.descricao ? '<div class="d-desc">' + esc(a.descricao) + '</div>' : '')

    + wikiBlock
    + refBlock
    + '</div>';

  document.title = nome + " — MARKTRADE — BAPZX";
}

carregarDetalhe();
</script>
<script src="track.js" defer></script>
</body>
</html>
