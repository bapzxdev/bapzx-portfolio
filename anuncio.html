<style>

  --bg:#0b0f1a; --panel:#111a2c; --panel-2:#18233a; --border:#22304a; --border-2:#2c3d5e;
  --text:#e6edf7; --muted:#8ea0b8; --green:#4ade80; --purple:#a78bfa; --blue:#60a5fa;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',Arial,sans-serif;color:var(--text);min-height:100vh;line-height:1.5;
  background:radial-gradient(1100px 520px at 85% -10%, rgba(124,58,237,.14), transparent 60%),
             radial-gradient(900px 460px at -10% 0%, rgba(52,211,153,.10), transparent 55%),
             var(--bg);

}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}

/* ============ TOPO DOS FILTROS / ANÚNCIO ============ */
.ann-hero{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.ann-back{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border-2);
  color:var(--text);font-size:13px;font-weight:600;border-radius:10px;padding:8px 14px;transition:.15s;flex-shrink:0;
}
.ann-back:hover{border-color:var(--blue);color:#fff;text-decoration:none}

/* ============ CARD PRINCIPAL ============ */

.detail{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:26px 26px 30px;position:relative}
.detail.vip{border-color:rgba(251,191,36,.45);background:linear-gradient(150deg,rgba(251,191,36,.06),var(--panel) 55%)}

.d-top-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.d-badge-vip{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;

  background:var(--grad-vip);border-radius:999px;padding:4px 12px;margin-bottom:10px;

.d-type{display:inline-flex;align-items:center;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:800;border:1px solid;letter-spacing:.2px}
.d-type.venda{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35);color:var(--green)}
.d-type.compra{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35);color:var(--blue)}
.d-type.outro{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4);color:var(--purple)}

.d-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.d-meta svg{display:block;flex-shrink:0;opacity:.75}

.d-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;margin-top:4px;align-items:start}

/* ------------ COLUNA ESQUERDA: INFOS DO ANÚNCIO ------------ */

.d-cats{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 0}

/* ------------ COLUNA DIREITA: CARD DO ITEM ------------ */

.d-item-title{font-family:'Sora',sans-serif;font-size:30px;line-height:1.2;color:#fff;margin:0;word-wrap:break-word;overflow-wrap:anywhere}
.d-item-title .d-tier{font-size:15px;font-weight:800;color:var(--purple);vertical-align:super;margin-left:4px}
.d-item-exam{color:var(--muted);font-size:13px;line-height:1.6;margin:0}

.d-desc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;white-space:pre-wrap;font-size:14px;color:var(--text);line-height:1.6}

<script>
const API_BASE = "https://bapzx-bot-tibia.onrender.com";
const MK_SPRITES = {
  gold: "https://www.tibiawiki.com.br/images/b/b0/Gold_Coin.gif",
  tc: "https://www.tibiawiki.com.br/images/5/55/Crystal_Coin.gif"
};
const coinImg = function (k, alt, w) {
  return '<img src="' + MK_SPRITES[k] + '" alt="' + alt + '" width="' + w + '" height="' + w + '" loading="lazy">';
};
const rootEl = document.getElementById("ann-root");

function params() {
  try {
    return new URLSearchParams(window.location.search);
  } catch (e) {
    const out = {};
    const m = (window.location.search || "").replace(/^\?/, "").split("&");
    for (let i = 0; i < m.length; i++) {
      if (!m[i]) continue;
      const kv = m[i].split("=");
      out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    }
    return { get: function (k) { return out[k]; } };
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.appendChild(document.createTextNode(s == null ? "" : String(s)));
  return d.innerHTML;
}

function initials(name) {
  const parts = String(name || "I").split(/[\s._-]+/).filter(Boolean);
  const a = parts[0] ? parts[0][0] : "I";
  const b = parts.length > 1 ? parts[parts.length - 1][0] : "";
  return (a + b).slice(0, 2).toUpperCase();
}

const SERVER_COLORS = {
  "auroria":"purple","belaria":"amber","bellum":"slate","drakaria":"blue",
  "eldrian":"purple","elysian":"green","infernum i":"blue","infernum ii":"blue",
  "infernum iii":"blue","lunarian":"purple","malveria":"amber","mystian":"purple",
  "obsidian":"slate","solarian":"green","tenebrium":"slate","vesperia":"slate",
};

function serverColor(world) {
  const key = (world || "").trim().toLowerCase();
  return SERVER_COLORS[key] || "slate";
}

function formatPrice(v) {
  if (v == null || v === "" || isNaN(Number(v))) return null;
  let n = Number(v);
  if (Math.floor(n) === n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  const s = n.toFixed(2).replace(/\.?0+$/, "");
  const parts = s.split(".");
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "." + parts[1] : "");
}

function formatDateTime(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return esc(String(iso));
    const pad = function (x) { return (x < 10 ? "0" : "") + x; };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear()
      + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  } catch (e) {
    return esc(String(iso));
  }
}

function statusChiado(status) {
  const s = String(status || "");
  if (!s) return "";
  if (s === "vendido") return "&#10004; Vendido";
  if (s === "expirado") return "&#9201; Expirado";
  return "&#128227; Ativo";
}

function kvRow(k, v, raw) {
  if (v == null || v === "") return "";
  return '<div class="d-row"><span class="d-k">' + k + '</span><span class="d-v">' + (raw === false ? esc(v) : v) + '</span></div>';
}

function monthDay(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return  d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
  } catch (e) { return ""; }
}

async function carregarDetalhe() {
  const p = params();
  const id = (p.get("id") || "").trim();
  if (!id || !/^\d+$/.test(id)) {
    rootEl.innerHTML = '<div class="ann-err">Anúncio não encontrado.<br><a href="troca.html" class="reload">← Voltar para os anúncios</a></div>';
    return;
  }

  let anuncio = null;
  try {
    const r = await fetch(API_BASE + "/api/troca/" + encodeURIComponent(id));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.ok || !data.anuncio) throw new Error("sem dados");
    anuncio = data.anuncio;
  } catch (e) {
    rootEl.innerHTML = '<div class="ann-err">Não foi possível carregar este anúncio (ele pode ter sido removido ou expirado).<br><a href="troca.html" class="reload">← Voltar para os anúncios</a></div>';
    return;
  }

  let info = null;
  let ref = null;
  let ficha = null;
  if (anuncio.nome) {
    try {
      const ir = await fetch(API_BASE + "/api/item?nome=" + encodeURIComponent(anuncio.nome));
      if (ir.ok) {
        const idata = await ir.json();
        if (idata && idata.ok) {
          info = idata.info && Object.keys(idata.info).length ? idata.info : null;
          ref = idata.referencia && typeof idata.referencia === "object" ? idata.referencia : null;
          ficha = idata.ficha_local && typeof idata.ficha_local === "object" ? idata.ficha_local : null;
        }
      }
    } catch (e) { /* info do wiki é bônus; segue sem ela */ }
  }

  renderizar(anuncio, info, ref, ficha);
}

function renderizar(a, info, ref, ficha) {
  const tipo = (a.tipo || "venda").toLowerCase();
  const tipoCls = tipo === "compra" ? "compra" : (tipo === "venda" ? "venda" : "outro");
  const tipoLbl = tipo === "compra" ? "Comprando" : (tipo === "venda" ? "Vendendo" : "Troca");
  const nome = (a.nome || "Item").trim();
  const world = a.world || "";

  const tier = (info && info.tier) ? esc(info.tier) : (a.tier != null && a.tier !== "" ? esc(String(a.tier).replace(/\.0$/,"")) : "");
  const dateHtml = a.criado_em
    ? '<span class="d-meta">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
      + formatDateTime(a.criado_em) + '</span>'
    : '';

  const tierChip = tier
    ? '<span class="d-tier-chip">&#128142; Tier ' + esc(tier) + '</span>'
    : '';

  const spriteHtml = a.sprite
    ? tierChip + '<img src="' + esc(a.sprite) + '" alt="' + esc(nome) + '" onerror="this.outerHTML=\'<div class=&quot;mini-ph&quot;>' + esc(initials(nome)) + '</div>\'">'
    : '<div class="mini-ph">' + esc(initials(nome)) + '</div>';

  const catHtml = (a.categoria ? '<div class="mini-cats"><span class="mini-cat-chip">' + esc(a.categoria) + '</span></div>' : '');

  const miniPrice = (function () {
    const p = formatPrice(a.preco);
    if (p !== null) {
      return '<div class="mini-price"><span class="mini-coin">' + coinImg("gold", "Gold", 17) + '</span><span class="mini-val">' + p + '</span></div>';
    }
    return '<div class="mini-offers">' + coinImg("gold", "Gold", 15) + ' Aceitando ofertas</div>';
  })();

  const contactHtml = a.contato
    ? '<div class="mini-contact" title="' + esc(a.contato) + '">' + esc(a.contato) + '</div>'
    : '';

  const shareLink = window.location.href;
  const shareTitle = tipoLbl + " " + nome + (world ? " em " + world : "");

  const descHtml = a.descricao
    ? '<div class="d-desc">' + esc(a.descricao) + '</div>'
    : '';

  const waDigitos = String(a.contato || "").replace(/\D/g, "");
  const waLink = waDigitos ? 'https://wa.me/55' + waDigitos : "";
  const contactBlock = a.contato
    ? '<section class="d-contact-box">'
      + '<h3>&#128172; Quer negociar este item?</h3>'
      + '<p>Envie sua mensagem para o anunciante informando o seu lance.</p>'
      + (waLink
        ? '<a class="d-contact" title="' + esc(a.contato) + '" href="' + waLink + '" target="_blank" rel="noopener">Chamar no WhatsApp &#128172;</a>'
        : '<div class="d-contact" title="' + esc(a.contato) + '">' + esc(a.contato) + '</div>')
      + '</section>'
    : '';

  const fichaLocalBlock = (function () {
    if (!ficha) return "";
    function rotuloDano(f) {
      if (!f.categoria) return f.tipo_dano ? "Dano Médio" : "Armadura";
      if (f.categoria === "Armas") return "Dano Médio";
      if (f.categoria === "Escudos" || f.categoria === "Spellbooks") return "Defesa";
      if (f.categoria === "Aljavas") return "Volume";
      return "Armadura";
    }
    const etiquetas = [
      ["nivel", "Nível"], ["vocacao", "Vocação"], ["tipo_dano", "Tipo de dano"],
      ["bonus", "Bônus"], ["protecao", "Proteção"],
      ["dano_medio", rotuloDano(ficha)],
      ["slots", "Slots"], ["tier", "Tier"], ["peso", "Peso"]
    ];
    const rows = [];
    etiquetas.forEach(function (par) {
      const v = ficha[par[0]];
      if (v == null || v === "") return;
      rows.push(kvRow(par[1], esc(String(v))));
    });
    if (!rows.length) return "";
    return '<section class="d-wiki d-ficha-local">'
      + '<h3>&#128295; Ficha do item</h3>'
      + '<p class="d-note">Dados da nossa base de itens.</p>'
      + '<div class="d-grid-kv">' + rows.join("") + '</div>'
      + '</section>';
  })();

  const wikiBlock = (function () {
    if (!info) return "";
    const rows = []
      + kvRow("Tipo", info.tipo_item)
      + kvRow("Nível requerido", info.nivel)
      + kvRow("Vocação", info.vocacoes)
      + kvRow("Armor", info.armor)
      + kvRow("Peso", info.peso)
      + kvRow("Imbuement slots", info.imbuement)
      + kvRow("Resistências", info.resistencias)
      + kvRow("Atributos", info.atributos)
      + kvRow("Classificação", info.classificacao)
      + kvRow("Tier", info.tier)
      + kvRow("Vende para", info.vende_para)
      + kvRow("Compra de", info.compra_de)
      + kvRow("Implementado em", info.implementado);
    if (!rows) return "";
    return '<section class="d-wiki">'
      + '<h3>&#128295; Sobre o item</h3>'
      + '<p class="d-note">Informações da ficha do item no Tibia Wiki.</p>'
      + '<div class="d-grid-kv">' + rows + '</div>'
      + '</section>';
  })();

  const importantBlock = '<section class="d-important">'
      + '<h3>&#128161; Informações importantes</h3>'
      + '<div class="d-imp-warn"><b>&#9888;&#65039; O BAPZX não gerencia as transações.</b>'
      + ' Nós simplesmente oferecemos uma forma conveniente para que o comprador e o vendedor se comuniquem e, portanto,'
      + ' não nos responsabilizamos caso a transação dê errado de alguma forma.</div>'
      + '<p>Nós recomendamos fortemente que você chame uma pessoa que possa ser confiada por ambas as partes para intermediar a transação.</p>'
      + '<div class="d-imp-links">'
      + '<a class="d-imp-link" href="troca.html?q=' + encodeURIComponent(nome) + '">&#128200; Ver histórico de negociações deste item</a>'
      + '<a class="d-imp-link" href="contato.html">&#9873;&#65039; Você acha que este anúncio é falso ou induz ao erro?</a>'
      + '</div>'
      + '</section>';

  rootEl.innerHTML =
    '<div class="detail' + (a.is_destaque ? ' vip' : '') + '">'
    + '<div class="d-top-row">'
    + '<span class="d-type ' + tipoCls + '">' + tipoLbl + '</span>'
    + ' <span class="d-meta">' + statusChiado(a.status) + '</span>'
    + dateHtml
    + '</div>'

    + '<div class="d-grid">'
    + '<div class="d-info">'
    + '<a class="mini-card' + (a.is_destaque ? ' vip' : '') + '" href="troca.html">'
    + '<div class="mini-top">'
    + '<span class="mini-type ' + tipoCls + '">' + tipoLbl + '</span>'
    + (dateHtml ? '<span class="mini-date"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + formatDateTime(a.criado_em) + '</span>' : '')
    + (a.is_destaque ? '<span class="mini-vip">&#11088; VIP</span>' : '')
    + '</div>'
    + '<div class="mini-name">' + esc(nome) + '</div>'
    + catHtml
    + '<div class="mini-sprite">' + spriteHtml + '</div>'
    + miniPrice
    + '<div class="mini-meta">'
    + (world ? '<div class="mini-server ' + serverColor(world) + '"><b>' + esc(world) + '</b></div>' : '')
    + '<span class="mini-user"><span class="mini-ava">' + esc(initials(a.jogador)) + '</span><span class="mini-uname">' + esc(a.jogador || "Anônimo") + '</span>' + (a.verificado ? '<span class="mini-check" title="Verificado">&#10004;</span>' : '') + '</span>'
    + (contactHtml ? '<div class="mini-contact-row">' + contactHtml + '</div>' : '')
    + '</div>'
    + '</a>'

    + '<section class="d-share">'
    + '<h3>&#128279; Compartilhe este anúncio</h3>'
    + '<p>Compartilhe o link deste anúncio em chats de grupo como Discord, WhatsApp e Telegram para aumentar a chance da troca acontecer.</p>'
    + '<p class="d-share-note">Todas as informações do anúncio serão exibidas no app de chat quando você enviar o link.</p>'
    + '<span class="d-share-lbl">Preview:</span>'
    + '<a class="d-share-link" href="' + esc(shareLink) + '" target="_blank" rel="noopener">' + esc(shareTitle) + '</a>'
    + '<button type="button" class="d-copy" id="d-copy-btn">&#128203; Copiar link</button>'
    + '</section>'
    + '</div>'

    + '<div class="d-item">'
    + '<h2 class="d-item-title">' + esc(nome) + (tier ? '<span class="d-tier">Tier ' + tier + '</span>' : '') + '</h2>'
    + descHtml
    + contactBlock
    + fichaLocalBlock
    + wikiBlock
    + importantBlock
    + '</div>'
    + '</div>'
    + '</div>';

  const copyBtn = document.getElementById("d-copy-btn");
  if (copyBtn) {
    copyBtn.addEventListener("click", function () {
      const done = function () {
        copyBtn.innerHTML = '&#10004; Link copiado!';
        setTimeout(function () { copyBtn.innerHTML = '&#128203; Copiar link'; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink).then(done).catch(function () { fallbackCopy(); done(); });
      } else {
        fallbackCopy();
        done();
      }
    });
  }

  document.title = nome + " — MARKTRADE — BAPZX";
}

function fallbackCopy() {
  try {
    const ta = document.createElement("textarea");
    ta.value = window.location.href;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) { /* ignora */ }
}

carregarDetalhe();
</script>
<script src="track.js" defer></script>
</body>
